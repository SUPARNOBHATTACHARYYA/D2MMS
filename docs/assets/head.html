<!-- Google Fonts: Lora everywhere + JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style id="gatekeeper-pre-style">
  .gatekeeper-locked body {
    overflow: hidden !important;
  }
  .gatekeeper-locked body > *:not(#gatekeeper-screen) {
    display: none !important;
  }
</style>
<script>
(function() {
  try {
    var isAuth = sessionStorage.getItem('course_auth') === 'granted' || localStorage.getItem('course_auth') === 'granted';
    if (!isAuth) {
      document.documentElement.classList.add('gatekeeper-locked');
    }
  } catch(e) {}
})();
</script>

<script>
(function() {
  var isSub = window.location.pathname.indexOf('/lectures/') !== -1;
  var prefix = isSub ? '../../' : './';
  var v = '?v=' + Date.now();
  document.write('<link rel="stylesheet" href="' + prefix + 'assets/vendor/katex/katex.min.css' + v + '">');
  document.write('<link rel="stylesheet" href="' + prefix + 'assets/css/vibrations-theme.css' + v + '">');
})();
</script>
